[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-remote-control"
version = "0.1.0"
description = "Система защищённого удалённого управления Antigravity CLI на Windows через Telegram с поддержкой Wake-on-LAN"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Developer" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiogram>=3.13.0,<4.0.0",
    "aiohttp-socks>=0.8.0",
    "pillow>=10.0.0",
]

[project.scripts]
remote-control-bot = "remote_control.controller.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_control"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = []
